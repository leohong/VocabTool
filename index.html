window.mapPos = (pos) => {
  if (!pos) return 'n.';
  const p = pos.toLowerCase().trim();
  if (p.includes('noun')) return 'n.';
  if (p.includes('verb')) return 'v.';
  if (p.includes('adjective')) return 'adj.';
  if (p.includes('adverb')) return 'adv.';
  if (p.includes('preposition')) return 'prep.';
  if (p.includes('conjunction')) return 'conj.';
  if (p.includes('pronoun')) return 'pron.';
  if (p.includes('determiner')) return 'det.';
  if (p.includes('article')) return 'art.';
  if (p.includes('idiom')) return 'idiom';
  return pos;
};

window.cleanApostrophe = (str) => {
  return (str || '').trim().toLowerCase().replace(/[’‘`′]/g, "'");
};

window.maskText = (text, word) => {
  if (!text || !word) return '';
  let maskedTextStr = text;
  const w = word.trim();
  const escaped = w.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
  
  const regex1 = new RegExp('\\b' + escaped + '[a-zA-Z]*\\b', 'gi');
  maskedTextStr = maskedTextStr.replace(regex1, '______');
  
  if (w.toLowerCase().includes('acknowledg')) {
    maskedTextStr = maskedTextStr.replace(/\backnowledg(e)?ment(s)?\b/gi, '______');
  } else if (w.toLowerCase().includes('judg')) {
    maskedTextStr = maskedTextStr.replace(/\bjudg(e)?ment(s)?\b/gi, '______');
  }
  
  return maskedTextStr;
};

window.maskExample = (eg, word) => {
  if (!eg || !word) return '';
  const parts = eg.split(/\s*(\([^)]+\))\s*$/);
  const enPart = parts[0];
  const zhPart = parts[1] || '';
  
  const maskedEn = window.maskText(enPart, word);
  return zhPart ? `${maskedEn} ${zhPart}` : maskedEn;
};

window.translateText = async (text) => {
  try {
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|zh-TW`);
    const json = await res.json();
    return json.responseData.translatedText || '';
  } catch (e) {
    console.error('Translation error:', e);
    return '';
  }
};

window.fetchDictionaryData = async (queryStr) => {
  const query = queryStr.trim().toLowerCase();
  if (!query) throw new Error('請輸入查詢單字');

  const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${query}`);
  if (!dictRes.ok) {
    if (dictRes.status === 404) {
      throw new Error('找不到該單字的定義');
    }
    throw new Error('Dictionary API 連線失敗');
  }

  const dictData = await dictRes.json();
  if (!dictData || dictData.length === 0) {
    throw new Error('未找到單字定義');
  }

  const wordZh = await window.translateText(query);
  const allExamples = [];
  dictData.forEach(entry => {
    entry.meanings.forEach(meaning => {
      const pos = window.mapPos(meaning.partOfSpeech);
      meaning.definitions.forEach(def => {
        if (def.example) {
          allExamples.push({ pos, egEn: def.example });
        }
      });
    });
  });

  const results = [];
  const firstEntry = dictData[0];

  firstEntry.meanings.forEach(meaning => {
    const pos = window.mapPos(meaning.partOfSpeech);
    meaning.definitions.forEach(def => {
      let chosenEgEn = def.example || '';
      if (!chosenEgEn) {
        const samePosEg = allExamples.find(e => e.pos === pos);
        if (samePosEg) {
          chosenEgEn = samePosEg.egEn;
        } else if (allExamples.length > 0) {
          chosenEgEn = allExamples[0].egEn;
        }
      }

      if (!chosenEgEn && def.definition) {
        const cleanWord = queryStr.trim();
        const article = /^[aeiou]/i.test(cleanWord) ? 'An' : 'A';
        chosenEgEn = `${article} ${cleanWord} is defined as: ${def.definition}`;
      }

      results.push({
        word: queryStr.trim(),
        pos: pos,
        enDef: def.definition,
        egEn: chosenEgEn,
        zh: wordZh || '',
        eg: ''
      });
    });
  });

  if (results.length === 0) {
    throw new Error('未找到單字定義內容');
  }

  const translationPromises = results.slice(0, 4).map(async (item) => {
    if (item.egEn) {
      const egZh = await window.translateText(item.egEn);
      item.eg = egZh ? `${item.egEn} (${egZh})` : item.egEn;
    }
  });

  await Promise.all(translationPromises);
  return results;
};

// 通用檔案下載與跨平台分享 (相容 App 原生沙盒寫入與 Web Blob 下載)
window.downloadFile = async (filename, content, contentType) => {
  try {
    const isNative = typeof window !== 'undefined' && 
                      window.Capacitor && 
                      window.Capacitor.isNativePlatform && 
                      window.Capacitor.isNativePlatform();

    if (isNative && window.Capacitor.Plugins.Filesystem) {
      const Filesystem = window.Capacitor.Plugins.Filesystem;
      const Share = window.Capacitor.Plugins.Share;

      // 寫入 Native CACHE 目錄
      const result = await Filesystem.writeFile({
        path: filename,
        data: content,
        directory: 'CACHE',
        encoding: 'utf8'
      });

      if (Share) {
        try {
          await Share.share({
            title: filename,
            text: `匯出檔案: ${filename}`,
            url: result.uri,
            dialogTitle: '分享或儲存備份檔案'
          });
        } catch (shareErr) {
          // 使用者取消分享不應拋出例外警告
          if (shareErr && (shareErr.message === 'Share canceled' || shareErr.name === 'AbortError')) {
            console.log('[Storage] User canceled share dialog.');
            return;
          }
          console.warn('[Storage] Share dialog error:', shareErr);
        }
      }
      return;
    }

    // Web 瀏覽器環境
    const blob = new Blob([content], { type: contentType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    console.error('[Storage] downloadFile error:', err);
    alert(`檔案匯出失敗：${err.message || err}`);
  }
};

window.exportDictionaryTXT = (vocabList, dbName) => {
  let content = "=== 特訓完整字庫 ===\n\n";
  vocabList.forEach((w, idx) => {
    content += `${idx + 1}. [${w.pos}] ${w.en} --> ${w.zh}${w.eg ? ` || ${w.eg}` : ''}\n`;
  });
  window.downloadFile(`字典_${dbName}.txt`, content, 'text/plain');
};

window.exportHistoryTXT = (historicalMistakes, vocabList, dbName) => {
  const historyList = Object.values(historicalMistakes || {});
  if (historyList.length === 0) return alert("歷史殿堂目前空空如也，無需匯出。");
  let content = `=== 歷史殿堂單字個人紀錄 ===\n\n`;
  historyList.forEach((m, idx) => {
    const itemData = (m && m.data) || { en: m?.en || '', zh: '[單字已自字典移除]', pos: 'n.', eg: '' };
    const vocabWord = (vocabList || []).find(w => w.en === itemData.en);
    const currentEg = (vocabWord && vocabWord.eg) || itemData.eg || '';
    content += `${idx + 1}. 錯誤次數: ${m.mistakesCount || m.totalFails || 0}次 | [${itemData.pos || 'n.'}] ${itemData.en || ''} --> ${itemData.zh || ''}${currentEg ? ` || ${currentEg}` : ''}\n`;
  });
  window.downloadFile(`歷史殿堂_${dbName}.txt`, content, 'text/plain');
};

window.exportImportUtils = {
  // 正規化極致輕量備份打包 (v3.0：剝離 mistakes/historicalMistakes 中重複的 data 實體，保留所有 SRS 冷卻與失誤指標)
  buildNormalizedBackup: (allDatabasesData, globalSettings) => {
    const normalizedDbs = {};

    for (const [db, dbObj] of Object.entries(allDatabasesData || {})) {
      const origState = dbObj.state ? JSON.parse(JSON.stringify(dbObj.state)) : null;
      if (origState) {
        // 1. 瘦身歷史殿堂 (historicalMistakes)

            normalizedMistakes[enKey] = rest;
          }
          origState.mistakes = normalizedMistakes;
        }

      normalizedDbs[db] = {
        settings: {
          wordsPerDay: dbObj.wordsPerDay ?? 50,
          ghostsPerDay: dbObj.ghostsPerDay ?? 10
        },
        vocabList: dbObj.vocabList || null,
        state: origState
      };
    }

    return {
      version: "3.0",
      backupType: "normalized_system",
      exportDate: new Date().toISOString(),
      globalSettings: {
        currentDB: globalSettings.currentDB || 'vocab_2000',
        dbList: globalSettings.dbList || ['vocab_2000', 'vocab_7000'],
        speechRate: globalSettings.speechRate ?? 0.8,
        speechEnabled: (globalSettings.speechEnabled === true || globalSettings.speechEnabled === 'true')
      },
      databases: normalizedDbs
    };
  },

  // 通用防禦型匯入解析與數據轉譯
  parseUniversalBackup: (data, rawVocabMap = {}) => {
    // 防禦 5: 嚴格布林型態轉換
    const parseStrictBoolean = (val, fallback = true) => {
      if (val === undefined || val === null) return fallback;
      if (val === true || val === 'true') return true;
      if (val === false || val === 'false') return false;
      return Boolean(val);
    };

    // 重建錯題實體 (雙重比對防禦：優先以現有字庫更新，若字庫無此字但錯題本身帶有實體 data 則安全保留)
    const rehydrateMistakes = (mistakesObj, vocabList) => {
      if (!mistakesObj || typeof mistakesObj !== 'object') return {};
      const vocabMap = new Map();
      (vocabList || []).forEach(w => {
        if (w && w.en) vocabMap.set(w.en, w);
      });

      const rehydrated = {};
      const entries = Array.isArray(mistakesObj)
        ? mistakesObj.map(item => [item.en || item.word || '', item])
        : Object.entries(mistakesObj);

      for (const [enKey, entry] of entries) {
        if (!entry) continue;
        let wordData = entry.data || ((entry.en || entry.word) ? entry : null);
        const targetKey = (wordData && (wordData.en || wordData.word)) ? (wordData.en || wordData.word) : enKey;
        if (!targetKey) continue;

        const found = vocabMap.get(targetKey) || (wordData && (wordData.en || wordData.word) ? wordData : null);

        if (found) {
          rehydrated[targetKey] = {
            ...entry,
            data: {
              en: found.en || found.word || targetKey,
              zh: found.zh || found.meaning || '[無譯義]',
              pos: found.pos || found.partOfSpeech || 'n.',
              eg: found.eg || found.example || ''
            }
          };
        }
      }
      return rehydrated;
    };

    const isSystemOrDbBackup = data && (data.backupType || data.databases || data.allDatabases || data.globalSettings || data.global || data.state);

    // 1. 全系統備份或單一字庫狀態備份 (優先解析系統備份，防止帶有 vocabList 陣列的系統備份被誤判為純單字清單)
    if (isSystemOrDbBackup) {
      if (data.backupType === 'normalized_system' || data.backupType === 'full_system' || data.databases || data.allDatabases || data.globalSettings || data.global) {
        const gs = data.globalSettings || data.global || {};
        const importedDbList = Array.isArray(gs.dbList) && gs.dbList.length > 0 ? gs.dbList : ['vocab_2000', 'vocab_7000'];
        const importedCurrentDB = gs.currentDB || data.dbName || importedDbList[0] || 'vocab_2000';
        const importedSpeechRate = typeof gs.speechRate === 'number' ? gs.speechRate : 0.8;
        const importedSpeechEnabled = parseStrictBoolean(gs.speechEnabled, true);

        const parsedDatabases = {};
        const dbsObj = data.databases || data.allDatabases || (data.state ? { [importedCurrentDB]: { state: data.state, vocabList: data.vocabList, wordsPerDay: data.wordsPerDay, ghostsPerDay: data.ghostsPerDay } } : {});

        for (const dbName of Object.keys(dbsObj)) {
          const rawDb = dbsObj[dbName] || {};
          let vocabList = Array.isArray(rawDb.vocabList) && rawDb.vocabList.length > 0 ? rawDb.vocabList : null;
          
          // 防禦 3: 空字庫降級 (自動自 rawVocabMap 載入)
          if (!vocabList || vocabList.length === 0) {
            if (rawVocabMap && rawVocabMap[dbName]) vocabList = rawVocabMap[dbName];
          }

          const rawState = rawDb.state || rawDb.userState || rawDb || {};
          const rawHistorical = rawState.historicalMistakes || rawState.history || rawState.historical || {};
          const rawActiveMistakes = rawState.mistakes || rawState.activeMistakes || rawState.mistakeList || {};

          const rehydratedHistorical = rehydrateMistakes(rawHistorical, vocabList);
          const rehydratedActiveMistakes = rehydrateMistakes(rawActiveMistakes, vocabList);

          const safeWPD = parseInt(rawWordsPerDay, 10) || 50;
          const parsedCurrentDay = parseInt(rawState.currentDay, 10) || 1;
          const parsedCompletedCount = (typeof rawState.completedWordsCount === 'number' && !isNaN(rawState.completedWordsCount) && rawState.completedWordsCount >= 0)
            ? rawState.completedWordsCount
            : Math.max(0, (parsedCurrentDay - 1) * safeWPD);

              mistakes: rehydratedActiveMistakes,
              historicalMistakes: rehydratedHistorical,
              streak: rawState.streak || { count: 0, lastDate: null }
            },
            wordsPerDay: safeWPD,
            ghostsPerDay: parseInt(rawGhostsPerDay, 10) || 10
          };
        }

        return {
          type: 'full_system',

            dbList: importedDbList,
            currentDB: importedCurrentDB,
            speechRate: importedSpeechRate,
            speechEnabled: importedSpeechEnabled
          },

      }

      if (data.state || data.customVocab) {

        let vocabList = Array.isArray(data.vocabList) && data.vocabList.length > 0 ? data.vocabList : (Array.isArray(data.customVocab) ? data.customVocab : null);

        const rawState = data.state || {};
        const rawHistorical = rawState.historicalMistakes || rawState.history || rawState.historical || {};

        return {
          type: 'single_db',

            currentDay: parseInt(rawState.currentDay, 10) || 1,
            learnedWords: Array.isArray(rawState.learnedWords) ? rawState.learnedWords : (Array.isArray(rawState.learned) ? rawState.learned : []),

    const rawListCandidate = Array.isArray(data) ? data : (data && (Array.isArray(data.vocabList) ? data.vocabList : (Array.isArray(data.words) ? data.words : (Array.isArray(data.data) ? data.data : (Array.isArray(data.items) ? data.items : null)))));

        zh: (item.zh || item.meaning || item.Chinese || item.Translation || '').trim(),
        pos: (item.pos || item.partOfSpeech || 'n.').trim(),
        eg: (item.eg || item.example || item.sentence || '').trim()
      })).filter(item => item.en && item.zh);

      if (importedWords.length > 0) {
        return {
          type: 'word_list',

        };

// 異步延遲工具
window.delayAsync = (ms, signal) => {
  return new Promise((resolve) => {
    if (signal && signal.aborted) {
      resolve();
      return;
    }
    const timer = setTimeout(() => {
      resolve();
    }, ms);

    if (signal) {
      signal.addEventListener('abort', () => {
        clearTimeout(timer);
        resolve();
      });
    }
  });
};

// 聽讀特訓異步發音 (支援 AbortSignal 與 Voice 選擇)
window.speakAsync = (text, lang, voiceName, speechRate = 1.0, audioSettings = {}, signal = null) => {
  return new Promise(async (resolve) => {
    if (signal && signal.aborted) {
      resolve();
      return;
    }

    const tts = window.getTtsPlugin();
    const rate = speechRate;

    if (tts) {
      console.log('TTS speakAsync native for:', text);
      try {

        if (signal && signal.aborted) return resolve();

        const onAbort = async () => {
          try { await tts.stop(); } catch (e) {}
          resolve();
        };
        if (signal) signal.addEventListener('abort', onAbort);

        await tts.speak({
          text: text,
          lang: lang || 'en-US',
          rate: rate,
          pitch: 1.0,
          volume: (audioSettings.volume ?? 80) / 100,
          category: 'ambient'
        });

        resolve();
      }

          console.warn('TTS speakAsync voice not found:', voiceName);
        }
      }

      utterance.onstart = () => console.log('TTS speakAsync started:', text);
      utterance.onend = () => {

        resolve();
      };
      utterance.onerror = (e) => {
        console.error('TTS speakAsync error event:', e.error, e);
        resolve();
      };

      const onAbort = () => {
        window.speechSynthesis.cancel();
        resolve();
      };
      if (signal) signal.addEventListener('abort', onAbort);

      window.speechSynthesis.speak(utterance);
    } else {
      // Fallback to Google Translate TTS API via HTML5 Audio
      console.log('TTS speakAsync using Google Translate fallback for:', text);
      try {
        const tl = lang ? lang.split('-')[0].toLowerCase() : 'en';

          resolve();
        };

        audio.onended = onAudioEnd;
        audio.onerror = (err) => {

          resolve();

            resolve();
          });
        }

        audio.play().catch(err => {
          console.error('Google TTS play failed:', err);
          resolve();
        });
      } catch (e) {
        console.error('Google TTS speakAsync Fallback failed:', e);

    }
  });

// 獲取本日進度單字清單
window.getDailyWordsList = (vocabList, currentDay, wordsPerDay, completedWordsCount) => {
  if (!vocabList || vocabList.length === 0) return [];
  const safeWPD = Math.max(1, parseInt(wordsPerDay, 10) || 50);
  let startIdx;
  if (typeof completedWordsCount === 'number' && !isNaN(completedWordsCount) && completedWordsCount >= 0) {
    startIdx = completedWordsCount;
  } else {
    startIdx = Math.max(0, ((currentDay || 1) - 1) * safeWPD);
  }
  return vocabList.slice(startIdx, startIdx + safeWPD);
};

// 獲取過濾搜尋單字清單
window.getFilteredVocabList = (vocabList, query) => {
  if (!vocabList) return [];
  if (!query || !query.trim()) return vocabList;
  const q = query.trim().toLowerCase();
  return vocabList.filter(w => 
    w.en.toLowerCase().includes(q) || 
    w.zh.includes(q) || 
    (w.pos && w.pos.toLowerCase().includes(q))
  );
};

// Pure function: 計算今日基本單字 + 幽靈字，供多個 Hook 共用
// 不依賴 React state，所有資料皆由參數傳入
window.computeDailyWords = (vocabList, currentDay, wordsPerDay, ghostsPerDay, historicalMistakes, completedWordsCount) => {
  // 防禦：onBlur 前 state 可能暫時為空字串或 NaN，強制回落預設值
  const safeWPD = Math.max(1, parseInt(wordsPerDay, 10) || 50);
  const safeGPD = Math.max(0, parseInt(ghostsPerDay, 10) || 0);
  
  let startIndex;
  if (typeof completedWordsCount === 'number' && !isNaN(completedWordsCount) && completedWordsCount >= 0) {
    startIndex = completedWordsCount;
  } else {
    startIndex = Math.max(0, ((currentDay || 1) - 1) * safeWPD);
  }

  let baseWords = vocabList.slice(startIndex, startIndex + safeWPD);
  if (baseWords.length === 0 && vocabList.length > 0) baseWords = vocabList.slice(-safeWPD);

  const baseEnSet = new Set(baseWords.map(w => w.en));
  const now = Date.now();

  const ghostWords = Object.values(historicalMistakes || {})
    .filter(h => !h.immune && (now - h.archivedDate) >= (h.interval * 24 * 60 * 60 * 1000))
    .filter(h => !baseEnSet.has(h.data.en))
    .slice(0, safeGPD)
    .map(h => ({ ...h.data, _hasCountedMistake: false, _isGhost: true, _historyData: h }));

  return { baseWords, ghostWords };
};

// 負責 Capacitor OTA 版本更新邏輯（版本比較、下載、應用）
// 與 App 主邏輯完全解耦，零狀態共享依賴。

window.useOtaUpdate = (appVersion) => {
  const [otaUpdating, setOtaUpdating] = React.useState(false);

  const getUpdaterPlugin = () => {
    if (typeof window !== 'undefined' && window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorUpdater) {
      return window.Capacitor.Plugins.CapacitorUpdater;
    }
    return null;
  };

  const triggerOtaCheck = async (updater) => {
    try {
      const UPDATE_CONFIG_URL = 'https://raw.githubusercontent.com/leohong/VocabTool-App/main/update.json';
      const response = await fetch(UPDATE_CONFIG_URL, { cache: 'no-store' });
      if (!response.ok) return;
      const remoteConfig = await response.json();

      if (remoteConfig.version && remoteConfig.url) {
        const isNewer = (remoteVer, localVer) => {
          const parse = (v) => v.split('.').map(n => parseInt(n, 10) || 0);
          const [rMajor, rMinor, rPatch] = parse(remoteVer);
          const [lMajor, lMinor, lPatch] = parse(localVer);
          if (rMajor !== lMajor) return rMajor > lMajor;
          if (rMinor !== lMinor) return rMinor > lMinor;
          return rPatch > lPatch;
        };

        if (isNewer(remoteConfig.version, appVersion)) {
          if (window.confirm(`發現新版特訓模組 (v${remoteConfig.version})，是否立即下載更新？\n（更新將重啟 App 生效）`)) {
            setOtaUpdating(true);
            try {
              console.log('[Update] Downloading package:', remoteConfig.url);
              const downloadResult = await updater.download({
                url: remoteConfig.url,
                version: remoteConfig.version
              });
              console.log('[Update] Download complete, applying update...');
              await updater.set(downloadResult);
            } catch (err) {
              console.error('[Update] OTA failed:', err);
              alert(`更新下載失敗：${err.message || err}`);
              setOtaUpdating(false);
            }
          }
        }
      }
    } catch (err) {
      console.warn('[Update] Update check skipped (offline or network error):', err.message || err);
    }
  };

  return { otaUpdating, setOtaUpdating, getUpdaterPlugin, triggerOtaCheck };
};

    if (baseWords.length === 0) return alert('字典為空，請先匯入字庫！');

    const initializedWords = baseWords.map(w => ({ ...w, _hasCountedMistake: false }));
    const combined = [...initializedWords, ...ghostWords];

    setSessionType('daily');
    setDailyStage(1);
    setCurrentSessionWords(combined);
    setQueue(combined);
    setCurrentWord(combined[0]);
    setView('scanning');
  };

  // --- startExamSession ---
  const startExamSession = async () => {
    const key = `vocab_tempSession_${dbName}_exam`;
    await window.persistentStorage.setSetting(key, null);

    if (mistakesTotal === 0) return alert('錯題庫目前完美清空，無需降溫大會考！🎉');
    const base = [...activeMistakesList].sort(() => 0.5 - Math.random()).slice(0, 50).map(m => ({ ...m.data, _hasCountedMistake: false }));
    const shuffled = assignRandomModes(base);
    setSessionType('exam');
    setCurrentSessionWords(shuffled);
    setQueue(shuffled);
    setCurrentWord(shuffled[0]);
    setTypoCount(0);
    setMustTypeCorrectly(false);
    setCopyFailCount(0);
    if (correctTimerRef.current) clearTimeout(correctTimerRef.current);
    setIsCorrectFeedback(false);
    setUserInput('');
    setView(pickViewForWord(shuffled[0], true));
  };

  // --- startHistoryCheck ---
  const startHistoryCheck = async () => {
    const key = `vocab_tempSession_${dbName}_history`;
    await window.persistentStorage.setSetting(key, null);

    if (historyTotal === 0) return alert('歷史殿堂目前為空，請先完成日常錯題的雙倍消除！');
    const base = Object.values(historicalMistakes).sort(() => 0.5 - Math.random()).slice(0, 50).map(h => ({ ...h.data, _hasCountedMistake: false, _isHistoryCheck: true, _historyData: h }));
    const shuffled = assignRandomModes(base);
    setSessionType('history');
    setCurrentSessionWords(shuffled);
    setQueue(shuffled);
    setCurrentWord(shuffled[0]);
    setTypoCount(0);
    setMustTypeCorrectly(false);
    setCopyFailCount(0);
    if (correctTimerRef.current) clearTimeout(correctTimerRef.current);
    setIsCorrectFeedback(false);
    setUserInput('');
    setView(pickViewForWord(shuffled[0], true));
  };

  // --- handleForceMistake ---
  const handleForceMistake = () => {
    speak(currentWord.en);
    punishWord(currentWord);
    proceedToNext();
  };

  // --- handleSurrender ---
  const handleSurrender = () => {
    speak(currentWord.en);
    setTypoCount(2);
    setMustTypeCorrectly(true);
    setCopyFailCount(0);
    setUserInput('');
    if (!currentWord._hasCountedMistake) {
      currentWord._hasCountedMistake = true;
      punishWord(currentWord);
    }
  };

  // --- handleScan (flashcard / MCQ) ---
  const handleScan = (isKnown) => {
    const current = queue[0];
    const newQueue = queue.slice(1);

    const isTestingStage = sessionType === 'exam' || sessionType === 'history' || (sessionType === 'daily' && dailyStage === 2);

    setState(prev => {
      const nextState = { ...prev };

      if (!nextState.learnedWords.includes(current.en)) {
        nextState.learnedWords = [...nextState.learnedWords, current.en];
      }

      if (isKnown && isTestingStage) {
        // 雙倍消除演算法 (Double Elimination Algorithm)
        if (prev.mistakes[current.en]) {
          const m = prev.mistakes[current.en];
          const newCorrect = (m.correctCount || 0) + 1;
          const target = Math.min(m.mistakesCount * 2, 6);

          if (newCorrect >= target) {
            const newHistory = { ...prev.historicalMistakes };
            newHistory[current.en] = {
              mistakesCount: m.mistakesCount,
              totalFails: (newHistory[current.en]?.totalFails || 0) + m.mistakesCount,
              archivedDate: Date.now(),
              step: 0, interval: 7, immune: false, data: current
            };
            delete nextState.mistakes[current.en];
            nextState.historicalMistakes = newHistory;
          } else {
            nextState.mistakes = { ...prev.mistakes, [current.en]: { ...m, correctCount: newCorrect } };
          }
        }

        // 歷史幽靈 / 隨機抽查 SRS 進階
        if (current._isGhost || current._isHistoryCheck) {
          const intervals = [7, 21, 60, 180];
          const h = current._historyData || prev.historicalMistakes[current.en];
          if (h) {
            const nextStep = (h.step || 0) + 1;
            const newHistory = { ...nextState.historicalMistakes };

            if (nextStep >= 4) {
              newHistory[current.en] = { ...h, immune: true };
            } else {
              newHistory[current.en] = { ...h, step: nextStep, interval: intervals[nextStep], archivedDate: Date.now() };
            }
            nextState.historicalMistakes = newHistory;
          }
        }
      }

      return nextState;
    });

    if (!isKnown) {
      current._hasCountedMistake = true;
      punishWord(current);
    }

    if (newQueue.length === 0) {
      if (sessionType === 'daily' && dailyStage === 1) {
        setDailyStage(2);
        setQueue(currentSessionWords);
        setCurrentWord(currentSessionWords[0]);
        setTypoCount(0);
        setMustTypeCorrectly(false);
        setCopyFailCount(0);
        if (correctTimerRef.current) clearTimeout(correctTimerRef.current);
        setIsCorrectFeedback(false);
        setUserInput('');
        setView('spelling');
      } else {
        if (sessionType === 'daily') {
          const todayStr = new Date().toDateString();
          setState(prev => {
            const last = prev.streak?.lastDate;
            let newStreak = prev.streak?.count || 0;
            if (last !== todayStr) {
              const yesterday = new Date();
              yesterday.setDate(yesterday.getDate() - 1);
              if (last === yesterday.toDateString()) newStreak += 1;
              else newStreak = 1;
            }
            const safeWPD = Math.max(1, parseInt(wordsPerDay, 10) || 50);
            const baseWordsCount = (currentSessionWords || []).filter(w => !w._isGhost).length || safeWPD;
            const prevCompleted = typeof prev.completedWordsCount === 'number' ? prev.completedWordsCount : Math.max(0, ((prev.currentDay || 1) - 1) * safeWPD);
            const newCompletedCount = prevCompleted + baseWordsCount;
            const newDay = Math.floor(newCompletedCount / safeWPD) + 1;
            return {
              ...prev,
              completedWordsCount: newCompletedCount,
              currentDay: newDay,
              streak: { count: newStreak, lastDate: todayStr }
            };
          });
        }
        setView('summary');
      }
    } else {
      setQueue(newQueue);
      setCurrentWord(newQueue[0]);
      // 隨機模式下，根據下一個 word 的標記切換 view (僅限降溫 exam 與深度 history)
      const isTestingStage = sessionType === 'exam' || sessionType === 'history';
      if (scanMode === 'random' && isTestingStage) {
        setView(newQueue[0]._randomIsSpelling ? 'spelling' : 'scanning');
      }
    }
  };

  // --- handleSpellingSubmit ---
  const handleSpellingSubmit = (e) => {
    if (e) e.preventDefault();

    if (isCorrectFeedback) {
      if (correctTimerRef.current) clearTimeout(correctTimerRef.current);
      setIsCorrectFeedback(false);
      proceedToNext();
      return;
    }

    const cleanInput = window.cleanApostrophe(userInput);
    const cleanTarget = window.cleanApostrophe(currentWord.en);
    const isCorrect = cleanInput === cleanTarget;

    if (isCorrect) {
      if (mustTypeCorrectly) {
        setCopyFailCount(0);
      } else {
        setState(prev => {
          const nextState = { ...prev };

          if (prev.mistakes[currentWord.en]) {
            const m = prev.mistakes[currentWord.en];
            const newCorrect = (m.correctCount || 0) + 1;
            const target = Math.min(m.mistakesCount * 2, 6);

            if (newCorrect >= target) {
              const newHistory = { ...prev.historicalMistakes };
              newHistory[currentWord.en] = {
                mistakesCount: m.mistakesCount,
                totalFails: (newHistory[currentWord.en]?.totalFails || 0) + m.mistakesCount,
                archivedDate: Date.now(),
                step: 0, interval: 7, immune: false, data: currentWord
              };
              delete nextState.mistakes[currentWord.en];
              nextState.historicalMistakes = newHistory;
            } else {
              nextState.mistakes = { ...prev.mistakes, [currentWord.en]: { ...m, correctCount: newCorrect } };
            }
          }

          // 歷史幽靈 / 隨機抽查 SRS 進階（與 handleScan 邏輯一致）
          if (currentWord._isGhost || currentWord._isHistoryCheck) {
            const intervals = [7, 21, 60, 180];
            const h = currentWord._historyData || prev.historicalMistakes[currentWord.en];
            if (h) {
              const nextStep = (h.step || 0) + 1;
              const newHistory = { ...nextState.historicalMistakes };

              if (nextStep >= 4) {
                newHistory[currentWord.en] = { ...h, immune: true };
              } else {
                newHistory[currentWord.en] = { ...h, step: nextStep, interval: intervals[nextStep], archivedDate: Date.now() };
              }
              nextState.historicalMistakes = newHistory;
            }
          }

          return nextState;
        });
      }

      setIsCorrectFeedback(true);
      if (correctTimerRef.current) clearTimeout(correctTimerRef.current);
      correctTimerRef.current = setTimeout(() => {
        setIsCorrectFeedback(false);
        proceedToNext();
      }, 180);
    } else {
      speak(currentWord.en);
      if (mustTypeCorrectly) {
        const nextCopyFail = copyFailCount + 1;
        if (nextCopyFail >= 3) {
          alert(`已連續輸入錯誤 ${nextCopyFail} 次，系統自動跳過此單字：${currentWord.en}`);
          setCopyFailCount(0);
          proceedToNext();
        } else {
          setCopyFailCount(nextCopyFail);
          setUserInput('');
        }
      } else {
        if (typoCount === 0) {
          setTypoCount(1);
          setUserInput('');
        } else {
          setTypoCount(2);
          setMustTypeCorrectly(true);
          setCopyFailCount(0);
          setUserInput('');
          if (!currentWord._hasCountedMistake) {
            currentWord._hasCountedMistake = true;
            punishWord(currentWord);
          }
        }
      }
    }
  };

  // --- handleExitSession ---
  const handleExitSession = async (view, audioState) => {
    if (window.confirm('確定要暫停離開嗎？')) {
      const key = getTempSessionKey(dbName, sessionType);
      if (key) {
        const sessionData = {
          date: new Date().toDateString(),
          view,
          sessionType,
          dailyStage,
          dbName,
          queue,
          currentSessionWords,
          spellingState: {
            userInput,
            typoCount,
            mustTypeCorrectly,
            copyFailCount,
            currentWordHasCountedMistake: currentWord?._hasCountedMistake || false
          },
          audioState: audioState || {}
        };
        await window.persistentStorage.setSetting(key, sessionData);
      }
      setView('dashboard');
    }
  };

  // --- goToNextDay ---
  const goToNextDay = () => {
    if (sessionType === 'daily') {
      const todayStr = new Date().toDateString();
      setState(prev => {
        const last = prev.streak?.lastDate;
        let newStreak = prev.streak?.count || 0;
        if (last !== todayStr) {
          const yesterday = new Date();
          yesterday.setDate(yesterday.getDate() - 1);
          if (last === yesterday.toDateString()) newStreak += 1;
          else newStreak = 1;
        }
        const safeWPD = Math.max(1, parseInt(wordsPerDay, 10) || 50);
        const baseWordsCount = (currentSessionWords || []).filter(w => !w._isGhost).length || safeWPD;
        const prevCompleted = typeof prev.completedWordsCount === 'number' ? prev.completedWordsCount : Math.max(0, ((prev.currentDay || 1) - 1) * safeWPD);
        const newCompletedCount = prevCompleted + baseWordsCount;
        const newDay = Math.floor(newCompletedCount / safeWPD) + 1;
        return {
          ...prev,
          completedWordsCount: newCompletedCount,
          currentDay: newDay,
          streak: { count: newStreak, lastDate: todayStr }
        };
      });
    }
    setView('dashboard');
  };

  // --- Keyboard listener ---
  React.useEffect(() => {
    const handleKeyDown = (e) => {
      const isMcq = scanMode === 'mcq' && (sessionType === 'exam' || sessionType === 'history' || (sessionType === 'daily' && dailyStage === 2));
      // view is not available here — this effect is managed in app.js
    };
    // Keyboard listener is managed from app.js due to view dependency
  }, []);

  return {
    // State
    sessionType, setSessionType,
    dailyStage, setDailyStage,
    queue, setQueue,
    currentWord, setCurrentWord,
    currentSessionWords, setCurrentSessionWords,
    userInput, setUserInput,
    typoCount, setTypoCount,
    mustTypeCorrectly, setMustTypeCorrectly,
    copyFailCount, setCopyFailCount,
    isCorrectFeedback, setIsCorrectFeedback,
    correctTimerRef,
    // Derived
    activeMistakesList,
    mistakesTotal,
    historyTotal,
    // Functions
    punishWord,
    proceedToNext,
    startTodaySession,
    startExamSession,
    startHistoryCheck,
    handleForceMistake,
    handleSurrender,
    handleScan,
    handleSpellingSubmit,
    handleExitSession,
    goToNextDay,
  };
};

  const isTestingStage = sessionType === 'exam' || sessionType === 'history';

    scanMode === 'mcq' ||

    if (isMcqMode) {

      setIsAnswered(false);

      const correctZh = (currentWord.zh || '').trim();

      // 彙整抽樣池：包含特訓字庫、錯題集中營與歷史殿堂的所有單字
      const mistakesPool = (activeMistakesList || []).map(m => m.data || m);
      const historyPool = Object.values(historicalMistakes || {}).map(h => h.data || h);
      const combinedPool = [...(vocabList || []), ...mistakesPool, ...historyPool];

      // 自字庫、錯題與歷史殿堂隨機挑選 3 個不重複的相異中文釋義干擾選項
      const distractors = combinedPool
        .filter(w => w && w.zh && w.zh.trim() && w.zh.trim() !== correctZh)
        .map(w => w.zh.trim());

      const uniqueDistractors = Array.from(new Set(shuffledDistractors)).slice(0, 3);

      // 若字庫數量過少不足 3 個，補充預設輔助選項
      const fallbackOptions = ['特別的', '重要的', '明顯的', '額外的', '基本的'];
      while (uniqueDistractors.length < 3) {
        const fb = fallbackOptions[Math.floor(Math.random() * fallbackOptions.length)];
        if (fb !== correctZh && !uniqueDistractors.includes(fb)) {
          uniqueDistractors.push(fb);
        }
      }

    return '目前分頁 (前 50 字)';

              <button

                  audioSource === 'mistakes' 
                    ? 'bg-indigo-600/20 border-indigo-500 text-indigo-300 shadow-[0_0_10px_rgba(99,102,241,0.15)]' 
                    : 'bg-slate-900 border-slate-700 text-slate-400 hover:bg-slate-850'
                }`}
              >
                🔥 錯題集中營 ({totalMistakesCount})
              </button>
              <button
                type="button"
                onClick={() => { setAudioSource('history'); setAudioRange('all'); }}
                className={`py-3 px-4 rounded-xl border font-bold text-center transition-all ${
                  audioSource === 'history' 
                    ? 'bg-indigo-600/20 border-indigo-500 text-indigo-300 shadow-[0_0_10px_rgba(99,102,241,0.15)]' 
                    : 'bg-slate-900 border-slate-700 text-slate-400 hover:bg-slate-850'

              <button

            🚀 開始
          </button>
        </div>

};

}) => {

          <div>

            <p className="text-xs text-slate-400 mt-0.5">目前字庫：{dbName} • 總共 {vocabList.length} 個單字</p>
          </div>
          <button onClick={() => setShowAllPreviewModal(false)} className="p-2 text-slate-400 hover:text-slate-200 bg-slate-700 rounded-full">✕</button>
        </div>

        {/* Filter and Search */}
        <div className="p-4 border-b border-slate-700/50 flex gap-2">
          <input
            type="text"
            value={allSearchQuery}
            onChange={(e) => { setAllSearchQuery(e.target.value); setAllPage(1); }}
            placeholder="輸入關鍵字篩選單字、詞性或釋義..."
            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-xs focus:outline-none focus:border-indigo-500 font-mono text-indigo-300"
          />
        </div>

        {/* List Container */}
        <div className="p-4 flex-1 overflow-y-auto space-y-2 font-sans">
          {(() => {
            const filtered = getFilteredVocab();
            if (filtered.length === 0) {
              return <div className="text-center py-12 text-slate-500">無符合篩選條件的單字。</div>;
            }
            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            const currentPage = Math.min(allPage, totalPages);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const paginated = filtered.slice(startIndex, startIndex + itemsPerPage);

            return (
              <>
                <div className="space-y-2">
                  {paginated.map((word) => (
                    <div key={word.originalIdx} className="flex items-center justify-between p-3 bg-slate-900/50 rounded-xl border border-slate-700/60 gap-2.5 sm:gap-3 group">
                      <div className="flex items-center gap-2.5 sm:gap-3 min-w-0 flex-1">
                        <button
                          onClick={() => speak(word.en, true)}
                          className="p-2 bg-slate-800 hover:bg-slate-700 text-indigo-400 rounded-lg border border-slate-700 shrink-0"
                          title="發音"
                        >
                          <IconVolume />
                        </button>
                        <div className="min-w-0 flex-1">
                          <div className="flex flex-wrap items-baseline gap-1.5 sm:gap-2">
                            <span className="font-bold font-mono text-sm sm:text-base text-slate-200 break-all">{word.en}</span>
                            <span className="text-xs text-indigo-400 font-mono whitespace-nowrap">({word.pos})</span>
                            <span className="text-[10px] text-slate-500 font-mono whitespace-nowrap">#{word.originalIdx + 1}</span>
                          </div>
                          <span className="text-xs sm:text-sm text-slate-400 break-words block mt-0.5">{word.zh}</span>
                          {word.eg && <div className="text-xs text-slate-500 italic mt-1 font-sans break-words">{word.eg}</div>}
                        </div>
                      </div>
                      <div className="flex gap-1.5 shrink-0 opacity-90 group-hover:opacity-100 transition-opacity">
                        <button
                          onClick={() => startEditing(word.originalIdx)}
                          className="p-1.5 bg-slate-800 hover:bg-indigo-900 text-indigo-300 rounded border border-slate-700 text-xs"
                          title="編輯"
                        >
                          ✏️
                        </button>
                        <button
                          onClick={() => handleDeleteWord(word.originalIdx)}
                          className="p-1.5 bg-slate-800 hover:bg-rose-900 text-rose-300 rounded border border-slate-700 text-xs"
                          title="刪除"
                        >
                          🗑️
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Pagination Navigation */}
                {totalPages > 1 && (
                  <div className="flex justify-between items-center gap-1 sm:gap-2 pt-3 text-xs font-mono border-t border-slate-700/40 mt-2">
                    <button
                      disabled={currentPage === 1}
                      onClick={() => setAllPage(p => Math.max(1, p - 1))}
                      className="px-2.5 sm:px-3 py-1.5 bg-slate-700 hover:bg-slate-600 disabled:opacity-40 rounded text-slate-200 shrink-0 whitespace-nowrap"
                    >
                      ◀ 上一頁
                    </button>
                    <span className="text-slate-400 font-sans text-[11px] sm:text-xs text-center truncate px-1">
                      第 {currentPage} / {totalPages} 頁 (共 {filtered.length} 字)
                    </span>
                    <button
                      disabled={currentPage === totalPages}
                      onClick={() => setAllPage(p => Math.min(totalPages, p + 1))}
                      className="px-2.5 sm:px-3 py-1.5 bg-slate-700 hover:bg-slate-600 disabled:opacity-40 rounded text-slate-200 shrink-0 whitespace-nowrap"
                    >
                      下一頁 ▶
                    </button>
                  </div>
                )}
              </>
            );
          })()}
        </div>
      </div>
    </div>
  );
};

  const downloadFile = async (filename, content, type) => {
    const isNative = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();

    if (isNative) {
      let writeSuccess = false;
      try {
        const { Filesystem } = window.Capacitor.Plugins || {};
        const { Share } = window.Capacitor.Plugins || {};

        if (Filesystem && Share) {
          const result = await Filesystem.writeFile({
            path: filename,
            data: content,
            directory: 'CACHE',
            encoding: 'utf8'
          });
          writeSuccess = true;
          await Share.share({ title: filename, url: result.uri });
          return;
        }
      } catch (err) {
        console.error("Native file export/share failed:", err);
        if (writeSuccess) {
          console.log("User cancelled share sheet or share dismissed after successful write.");
          return;
        }
      }

      try {
        await navigator.clipboard.writeText(content);
        alert(`已複製匯出內容至剪貼簿！\n\n由於原生 App 限制，已自動將【${filename}】的內容複製到剪貼簿，您可以直接貼上至記事本儲存。`);
      } catch (clipErr) {
        console.error("Clipboard copy failed:", clipErr);
        alert("無法匯出檔案，請確保 App 權限。");
      }
    } else {
      const element = document.createElement("a");
      const file = new Blob([content], { type });
      element.href = URL.createObjectURL(file);
      element.download = filename;
      document.body.appendChild(element);
      element.click();
      document.body.removeChild(element);
      URL.revokeObjectURL(element.href);
    }
  };

  };

  const startEditing = (idx) => {
    if (idx === -1) {
      alert('此單字不在目前字庫中，無法編輯。如需編輯，請先將此單字新增至字庫。');
      return;
    }
    const w = vocabList[idx];
    if (!w) return;
    setEditingIndex(idx);
    setEditEn(w.en);
    setEditPos(w.pos);
    setEditZh(w.zh);
    setEditEg(w.eg || '');
  };

  const handleSaveEdit = (e) => {
    if (e) e.preventDefault();
    if (editingIndex === -1) return;
    if (!editEn.trim() || !editZh.trim()) {
      alert('請填寫英文單字與中文解釋！');
      return;
    }

    const originalWord = vocabList[editingIndex];
    const newEn = editEn.trim();
    const newPos = editPos.trim();
    const newZh = editZh.trim();
    const newEg = editEg.trim();
    const newWordData = { en: newEn, pos: newPos, zh: newZh, eg: newEg };

    const updatedList = [...vocabList];
    updatedList[editingIndex] = newWordData;
    setVocabList(updatedList);
    window.persistentStorage.saveDatabase(dbName, updatedList);

    setState(prev => {
      const nextState = { ...prev };
      if (prev.mistakes && prev.mistakes[originalWord.en]) {
        const m = prev.mistakes[originalWord.en];
        const updatedMistake = { ...m, data: newWordData };
        nextState.mistakes = { ...prev.mistakes };
        if (originalWord.en !== newEn) {
          delete nextState.mistakes[originalWord.en];
          nextState.mistakes[newEn] = updatedMistake;
        } else {
          nextState.mistakes[newEn] = updatedMistake;
        }
      }
      if (prev.historicalMistakes && prev.historicalMistakes[originalWord.en]) {
        const h = prev.historicalMistakes[originalWord.en];
        const updatedHistory = { ...h, data: newWordData };
        nextState.historicalMistakes = { ...prev.historicalMistakes };
        if (originalWord.en !== newEn) {
          delete nextState.historicalMistakes[originalWord.en];
          nextState.historicalMistakes[newEn] = updatedHistory;
        } else {
          nextState.historicalMistakes[newEn] = updatedHistory;
        }
      }
      return nextState;
    });

    if ((view === 'scanning' || view === 'spelling') && currentWord) {
      if (currentWord.en.trim().toLowerCase() === originalWord.en.trim().toLowerCase()) {
        setCurrentWord({ ...currentWord, ...newWordData });
      }
      const updatedQueue = queue.map(qw => {
        if (qw.en.trim().toLowerCase() === originalWord.en.trim().toLowerCase()) {
          return { ...qw, ...newWordData };
        }
        return qw;
      });
      setQueue(updatedQueue);
    }

    setEditingIndex(-1);
  };

  const getFilteredVocab = () => {
    const q = allSearchQuery.trim().toLowerCase();
    if (!q) return vocabList.map((w, originalIdx) => ({ ...w, originalIdx }));
    return vocabList
      .map((w, originalIdx) => ({ ...w, originalIdx }))
      .filter(w => w.en.toLowerCase().includes(q) || w.zh.toLowerCase().includes(q) || w.pos.toLowerCase().includes(q));
  };

  const resetDictState = () => {
    setSearchQuery('');
    setSearchLoading(false);
    setSearchError(null);
    setDictResults([]);
    setLocalMatches([]);
    setFormEn('');
    setFormPos('n.');
    setFormZh('');
    setFormEg('');
    setInsertPosition('end');
  };

  const performSearch = async (queryStr) => {
    const query = queryStr.trim().toLowerCase();
    if (!query) return;

    setSearchLoading(true);
    setSearchError(null);
    setDictResults([]);

    const matches = [];
    for (const db of dbList) {
      const list = await window.persistentStorage.loadDatabase(db);
      if (list && list.length > 0) {
        const foundIdx = list.findIndex(w => w.en.trim().toLowerCase() === query);
        if (foundIdx !== -1) {
          const wPerDay = await window.persistentStorage.getSetting(`vocab_wordsPerDay_${db}`, 50);
          const dayNum = Math.floor(foundIdx / wPerDay) + 1;
          matches.push({ db, word: list[foundIdx], day: dayNum });
        }
      }
    }
    setLocalMatches(matches);

    const currentDbMatch = matches.find(m => m.db === dbName);
    if (currentDbMatch) {
      setFormEn(currentDbMatch.word.en);
      setFormPos(currentDbMatch.word.pos);
      setFormZh(currentDbMatch.word.zh);
      setFormEg(currentDbMatch.word.eg || '');
    } else {
      setFormEn(queryStr.trim());
      setFormPos('n.');
      setFormZh('');
      setFormEg('');
    }

    try {
      const results = await window.fetchDictionaryData(queryStr);
      setDictResults(results);
      setFormEn(results[0].word);
      setFormPos(results[0].pos);
      setFormZh(results[0].zh);
      setFormEg(results[0].eg || results[0].egEn || '');
    } catch (err) {
      console.error(err);
      setSearchError(`查詢失敗（${err.message}）。您仍可以直接在下方手動輸入。`);
    } finally {
      setSearchLoading(false);
    }
  };

  const handleSearch = async (e) => {
    if (e) e.preventDefault();
    await performSearch(searchQuery);
  };

  const handleAddWord = async (e) => {
    e.preventDefault();
    const enVal = formEn.trim();
    const posVal = formPos.trim();
    const zhVal = formZh.trim();
    const egVal = formEg.trim();

    if (!enVal || !zhVal) {
      alert('請填寫英文單字與中文解釋！');
      return;
    }

    const newWord = { en: enVal, pos: posVal, zh: zhVal };
    if (egVal) newWord.eg = egVal;

    const existingIdx = vocabList.findIndex(w => w.en.trim().toLowerCase() === enVal.toLowerCase());
    let updatedList = [...vocabList];

    if (existingIdx !== -1) {
      if (!window.confirm(`單字【${enVal}】已存在目前字庫中，是否覆寫？`)) return;
      updatedList[existingIdx] = { ...updatedList[existingIdx], ...newWord };
    } else {
      if (insertPosition === 'current') {
        const targetIndex = currentDay * wordsPerDay;
        updatedList.splice(Math.min(targetIndex, updatedList.length), 0, newWord);
      } else {
        updatedList.push(newWord);
      }
    }

    setVocabList(updatedList);
    await window.persistentStorage.saveDatabase(dbName, updatedList);
    alert(`成功將單字【${enVal}】${existingIdx !== -1 ? '修改' : '新增'}至目前字庫中！`);
    setFormEn('');
    setFormPos('n.');
    setFormZh('');
    setFormEg('');
    setDictResults([]);
    setLocalMatches([]);
  };

  // ----------------------------------------
  // --- 10. 畫面渲染 (UI 分派) ---
  // ----------------------------------------
  if (!appLoaded) {
    return (
      <div className="w-full max-w-md mx-auto flex flex-col items-center justify-center min-h-[60vh] bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl text-center space-y-6 animate-[fadeIn_0.3s_ease-in-out]">
        <div className="w-16 h-16 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        <div>
          <h2 className="text-2xl font-black text-indigo-400 tracking-wide">極限單字特訓系統</h2>
          <p className="text-slate-400 text-sm mt-2 font-medium">讀取特訓存檔中，請稍候...</p>
        </div>
      </div>
    );
  }

  return (
    <div className="w-full flex flex-col">

      {/* Header 元件 */}
      {!(view === 'spelling' && isInputFocused) && (
        <Header
          displayVersion={DISPLAY_VERSION}
          indicator={indicator}
          mistakesTotal={mistakesTotal}
          streak={streak}
          currentDay={currentDay}
          setCurrentDay={(d) => setState(prev => ({ ...prev, currentDay: d, completedWordsCount: Math.max(0, (d - 1) * Math.max(1, parseInt(wordsPerDay, 10) || 50)) }))}
          vocabListLength={vocabList.length}
          wordsPerDay={wordsPerDay}
          view={view}
        />
      )}

      {/* Main View 元件 */}
      <main className="flex-1 flex flex-col justify-center items-center">
        {view === 'dashboard' && (
          <Dashboard
            startTodaySession={startTodaySession}
            startExamSession={startExamSession}
            startHistoryCheck={startHistoryCheck}
            setShowAudioSetupModal={handleAudioSetupClick}
            setShowPreviewModal={setShowPreviewModal}
            setShowMistakeModal={setShowMistakeModal}
            setShowHistoryModal={setShowHistoryModal}
            setShowAllPreviewModal={setShowAllPreviewModal}
            setAllSearchQuery={setAllSearchQuery}
            setAllPage={setAllPage}
            setShowDictModal={setShowDictModal}
            resetDictState={resetDictState}
            vocabList={vocabList}
            activeMistakesList={activeMistakesList}
            learnedWords={learnedWords}
            historyTotal={historyTotal}
            dbName={dbName}
            setDbName={setDbName}
            dbList={dbList}
            handleAddDB={handleAddDB}
            wordsPerDay={wordsPerDay}
            setWordsPerDay={setWordsPerDay}
            ghostsPerDay={ghostsPerDay}
            setGhostsPerDay={setGhostsPerDay}
            speechRate={speechRate}
            setSpeechRate={setSpeechRate}
            speechEnabled={speechEnabled}
            setSpeechEnabled={setSpeechEnabled}
            scanMode={scanMode}
            setScanMode={setScanMode}
            exportDictionaryTXT={exportDictionaryTXT}
            setShowImportOptionsModal={setShowImportOptionsModal}
            exportHistoryTXT={exportHistoryTXT}
            handleImportHistoryTXT={handleImportHistoryTXT}
            exportJson={exportJson}
            handleImportJson={handleImportJson}
            resetProgress={resetProgress}
            deleteCurrentDB={deleteCurrentDB}
            setShowLicensesModal={setShowLicensesModal}
          />
        )}

        {view === 'scanning' && currentWord && (
          <ScanningSession
            queue={queue}
            currentWord={currentWord}
            sessionType={sessionType}
            dailyStage={dailyStage}
            scanMode={scanMode}
            handleExitSession={handleExitSession}
            setIsDictHintMode={setIsDictHintMode}
            setDictMaskWord={setDictMaskWord}
            setShowDictModal={setShowDictModal}
            setSearchQuery={setSearchQuery}
            performSearch={performSearch}
            speak={speak}
            startEditing={startEditing}
            handleDeleteWord={handleDeleteWord}
            vocabList={vocabList}
            activeMistakesList={activeMistakesList}
            historicalMistakes={historicalMistakes}
            handleScan={handleScan}
          />
        )}

        {view === 'spelling' && currentWord && (
          <SpellingSession
            queue={queue}
            currentWord={currentWord}
            sessionType={sessionType}
            handleExitSession={handleExitSession}
            speak={speak}
            startEditing={startEditing}
            handleDeleteWord={handleDeleteWord}
            vocabList={vocabList}
            typoCount={typoCount}
            mustTypeCorrectly={mustTypeCorrectly}
            copyFailCount={copyFailCount}
            userInput={userInput}
            setUserInput={setUserInput}
            isInputFocused={isInputFocused}
            setIsInputFocused={setIsInputFocused}
            inputRef={inputRef}
            handleSpellingSubmit={handleSpellingSubmit}
            handleSurrender={handleSurrender}
            handleForceMistake={handleForceMistake}
            proceedToNext={proceedToNext}
            isCorrectFeedback={isCorrectFeedback}
          />
        )}

        {view === 'summary' && (
          <SummarySession
            sessionType={sessionType}
            goToNextDay={goToNextDay}
          />
        )}

        {view === 'audio_player' && audioQueue.length > 0 && (
          <AudioPlayer
            audioQueue={audioQueue}
            currentAudioIndex={currentAudioIndex}
            stopAudio={stopAudio}
            audioSource={audioSource}
            blindMode={blindMode}
            setBlindMode={setBlindMode}
            audioSubStep={audioSubStep}
            activeSpellingChar={activeSpellingChar}
            audioStatusText={audioStatusText}
            playPrevWord={playPrevWord}
            isAudioPlaying={isAudioPlaying}
            pauseAudio={pauseAudio}
            startAudio={startAudio}
            playNextWord={playNextWord}
            audioSettings={audioSettings}
          />
        )}
      </main>

      {/* --- Helper Modals --- */}
      <AudioSetupModal
        showAudioSetupModal={showAudioSetupModal}
        setShowAudioSetupModal={setShowAudioSetupModal}
        audioSource={audioSource}
        setAudioSource={setAudioSource}
        audioRange={audioRange}
        setAudioRange={setAudioRange}
        audioStartIdx={audioStartIdx}
        setAudioStartIdx={setAudioStartIdx}
        audioEndIdx={audioEndIdx}
        setAudioEndIdx={setAudioEndIdx}
        vocabList={vocabList}
        activeMistakesList={activeMistakesList}
        historicalMistakes={historicalMistakes}
        itemsPerPage={itemsPerPage}
        allPage={allPage}
        audioSettings={audioSettings}
        setAudioSettings={setAudioSettings}
        voices={voices}
        startAudioSession={handleStartAudioSession}
        speechRate={speechRate}
      />

      <PreviewModal
        showPreviewModal={showPreviewModal}
        setShowPreviewModal={setShowPreviewModal}
        dbName={dbName}
        getDailyWords={getDailyWords}
        speak={speak}
        startEditing={startEditing}
        handleDeleteWord={handleDeleteWord}
        vocabList={vocabList}
      />

      <MistakeModal
        showMistakeModal={showMistakeModal}
        setShowMistakeModal={setShowMistakeModal}
        activeMistakesList={activeMistakesList}
        speak={speak}
        vocabList={vocabList}
        startEditing={startEditing}
        handleDeleteWord={handleDeleteWord}
        setState={setState}
      />

      <HistoryModal
        showHistoryModal={showHistoryModal}
        setShowHistoryModal={setShowHistoryModal}
        historyTotal={historyTotal}
        historicalMistakes={historicalMistakes}
        speak={speak}
      />

      <DictModal
        showDictModal={showDictModal}
        setShowDictModal={setShowDictModal}
        isDictHintMode={isDictHintMode}
        dictMaskWord={dictMaskWord}
        searchQuery={searchQuery}
        setSearchQuery={setSearchQuery}
        speak={speak}
        handleSearch={handleSearch}
        searchLoading={searchLoading}
        searchError={searchError}
        localMatches={localMatches}
        dbName={dbName}
        dictResults={dictResults}
        setFormEn={setFormEn}
        setFormPos={setFormPos}
        setFormZh={setFormZh}
        setFormEg={setFormEg}
        formEn={formEn}
        formPos={formPos}
        formZh={formZh}
        formEg={formEg}
        insertPosition={insertPosition}
        setInsertPosition={setInsertPosition}
        handleAddWord={handleAddWord}
        currentDay={currentDay}
      />

      <AllPreviewModal
        showAllPreviewModal={showAllPreviewModal}
        setShowAllPreviewModal={setShowAllPreviewModal}
        dbName={dbName}
        vocabList={vocabList}
        allSearchQuery={allSearchQuery}
        setAllSearchQuery={setAllSearchQuery}
        setAllPage={setAllPage}
        allPage={allPage}
        itemsPerPage={itemsPerPage}
        getFilteredVocab={getFilteredVocab}
        speak={speak}
        startEditing={startEditing}
        handleDeleteWord={handleDeleteWord}
      />

      <EditWordModal
        editingIndex={editingIndex}
        setEditingIndex={setEditingIndex}
        editEn={editEn}
        setEditEn={setEditEn}
        editPos={editPos}
        setEditPos={setEditPos}
        editZh={editZh}
        setEditZh={setEditZh}
        editEg={editEg}
        setEditEg={setEditEg}
        speak={speak}
        handleSaveEdit={handleSaveEdit}
      />

      <ImportOptionsModal
        showImportOptionsModal={showImportOptionsModal}
        setShowImportOptionsModal={setShowImportOptionsModal}
        loadBuiltInVocab={loadBuiltInVocab}
        handleImportTXT={handleImportTXT}
      />

      <LicensesModal
        showLicensesModal={showLicensesModal}
        setShowLicensesModal={setShowLicensesModal}
      />

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);


  </script>

  <style>
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</body>

</html>
